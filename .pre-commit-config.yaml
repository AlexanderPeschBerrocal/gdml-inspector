exclude: ^(exports|build|dist)/

repos:
  # Use the project's locked Ruff, with no separate hook environment or tool
  # download. Contributors must sync the hooks/dev group before installing.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (safe fixes)
        entry: uv run --no-sync --offline python -m ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync --offline python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
