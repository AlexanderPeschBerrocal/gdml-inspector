name: Release
on:
  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump
        required: true
        type: choice
        options: [major, minor, patch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked
      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare the release commit and tag
        run: uv run --no-sync python scripts/release.py "${{ inputs.part }}"
      - name: Validate the prepared release
        run: uv run --no-sync python scripts/check_release.py
      - name: Determine the new tag
        id: tag
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Push the release commit and tag atomically
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${{ steps.tag.outputs.tag }}"
      - name: Trigger the publish workflow
        # A push authenticated with GITHUB_TOKEN does not trigger other
        # workflows' tag-push events (GitHub's own anti-recursion
        # protection), so the publish workflow is started explicitly.
        run: gh workflow run publish-release.yml --ref "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
