name: Mypy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install the project uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked typing environment
        run: uv sync --locked --no-default-groups --group typing
      - name: Run type checks
        run: uv run --no-sync mypy
