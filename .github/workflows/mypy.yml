name: Mypy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked typing environment
        run: uv sync --locked --no-default-groups --group typing
      - name: Run type checks
        run: uv run --no-sync mypy
