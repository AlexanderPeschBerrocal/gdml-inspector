name: pyg4ometry backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pyg4ometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the project uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install the locked environment with the optional pyg4ometry backend
        run: uv sync --locked --extra pyg4ometry
      - name: Record the tested pyg4ometry version
        # pyg4ometry.__version__ can report "unknown version" on a
        # pip-installed wheel (its setuptools_scm file isn't always
        # generated on install); the installed distribution's own
        # metadata is the reliable source.
        run: uv run --no-sync python -c "from importlib.metadata import version as v; print('pyg4ometry', v('pyg4ometry'))"
      - name: Test the pyg4ometry backend
        run: uv run --no-sync pytest tests/test_pyg4ometry_backend.py -v
