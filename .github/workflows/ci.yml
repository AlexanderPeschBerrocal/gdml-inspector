name: Tests and distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The development pin does not restrict the package's supported range.
        python: ['3.10', '3.11', '3.12.16', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked test environment (no browser tooling)
        # The browser tests have their own job; without the `browser` group
        # they are skipped at collection time. release/build are needed by
        # the release-script and packaging tests.
        run: uv sync --locked --no-default-groups --group test --group release --group build
      - name: Test with package and branch coverage
        run: uv run --no-sync pytest --cov=gdml_inspector --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked browser-test environment
        run: uv sync --locked --no-default-groups --group test --group browser
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Smoke-test both viewers in a real browser
        # Headless Chromium falls back to software WebGL on a GPU-less
        # runner; the suite fails visibly if no WebGL context can be made.
        run: >-
          uv run --no-sync pytest tests/test_*browser*.py -v
          --screenshot only-on-failure --tracing retain-on-failure
          --output test-results
      - name: Upload failure screenshots, traces and browser logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-artifacts
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload review screenshots (overview and cutaway, both modes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-screenshots
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked lint environment
        run: uv sync --locked --no-default-groups --group lint
      - name: Check Python formatting
        run: uv run --no-sync python -m ruff format --check .
      - name: Check Python lint
        run: uv run --no-sync python -m ruff check --output-format=github .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the project uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Verify project metadata and lock agree
        run: uv lock --check
      - name: Install the locked build environment
        run: uv sync --locked --no-default-groups --group build
      - name: Build with the locked build tools
        run: uv run --no-sync python -m build --no-isolation
      - name: Verify the wheel outside the checkout
        shell: bash
        run: |
          # The one authoritative version value, read from the checkout
          # directly (not re-derived from the installed wheel, which is
          # exactly what this check must validate independently of).
          DECLARED_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          uv venv /tmp/inspector-wheel
          # Resolve the wheel's public metadata independently of uv.lock.
          uv pip install --python /tmp/inspector-wheel/bin/python dist/*.whl
          uv pip check --python /tmp/inspector-wheel/bin/python
          cd /tmp
          DECLARED_VERSION="$DECLARED_VERSION" /tmp/inspector-wheel/bin/python -I - <<'PY'
          import os
          from importlib.metadata import distribution

          package = distribution("gdml-inspector")
          assert package.metadata.get_all("Provides-Extra") == ["pyg4ometry"]
          requirements = package.requires or []
          assert len(requirements) == 1
          assert requirements[0].startswith("pyg4ometry;")
          assert "extra ==" in requirements[0]
          declared = os.environ["DECLARED_VERSION"]
          assert package.version == declared, (package.version, declared)
          PY
          CLI_VERSION=$(/tmp/inspector-wheel/bin/gdml-inspector --version)
          case "$CLI_VERSION" in
            *" $DECLARED_VERSION") ;;
            *) echo "gdml-inspector --version printed '$CLI_VERSION', expected it to end with ' $DECLARED_VERSION'" >&2; exit 1 ;;
          esac
          /tmp/inspector-wheel/bin/gdml-inspector "$GITHUB_WORKSPACE/examples/detector.gdml" --backend python --out /tmp/detector.html
          /tmp/inspector-wheel/bin/gdml-inspector --lazy "$GITHUB_WORKSPACE/examples/detector.gdml" --backend python --out /tmp/detector-lazy.html
