<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDML Inspector - __TITLE__</title>
<style>
html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
body {
  --bg: #f7f8fb; --panel: #ffffff; --text: #1d2430; --muted: #475569;
  --border: #d9dde7; --soft: #f8fafc; --pill: #eef2ff; --canvas: #fbfcff;
  --warn-bg: #fff7ed; --warn-border: #fed7aa; --hud: rgba(255,255,255,.86);
  background: var(--bg); color: var(--text);
}
body.dark {
  --bg: #0f172a; --panel: #111827; --text: #e5e7eb; --muted: #a3b1c6;
  --border: #334155; --soft: #1f2937; --pill: #243044; --canvas: #08111f;
  --warn-bg: #2b2115; --warn-border: #7c4a16; --hud: rgba(15,23,42,.86);
}
#app { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; height: 100%; }
aside { border-right: 1px solid var(--border); padding: 14px; overflow: auto; background: var(--panel); }
main { position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; background: var(--canvas); }
h1 { font-size: 18px; margin: 0 0 10px; }
h2 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; margin: 3px 0; }
input, select, button { width: 100%; box-sizing: border-box; margin: 5px 0; color: var(--text); background: var(--soft); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
button { cursor: pointer; }
input[type=checkbox] { width: auto; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.pill { display: inline-block; padding: 2px 7px; border-radius: 99px; background: var(--pill); margin: 2px; font-size: 12px; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); padding: 8px; border-radius: 6px; font-size: 12px; max-height: 200px; overflow: auto; }
.diagnostic-row { margin: 4px 0; padding-bottom: 4px; border-bottom: 1px solid var(--warn-border); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.diagnostic-row:last-child { border-bottom: none; }
#details { font-size: 12px; background: var(--soft); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto; }
.inspector-field { display: grid; grid-template-columns: 110px 1fr; gap: 6px; margin: 2px 0; word-break: break-word; }
.inspector-field span { color: var(--muted); }
.inspector-section { margin: 10px 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: pre-wrap; }
#hud { position: absolute; left: 12px; bottom: 12px; background: var(--hud); padding: 8px 10px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border); }
.axis-label { position: absolute; display: none; pointer-events: none; font-size: 13px; font-weight: 800; transform: translate(-50%, -50%); text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel); }
.material-list { display: grid; gap: 4px; max-height: 230px; overflow: auto; padding-right: 4px; }
.material-item { display: grid; grid-template-columns: auto 18px 1fr auto; gap: 7px; align-items: center; font-size: 12px; padding: 3px 0; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }
.small-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.camera-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.camera-actions button { font-size: 11px; padding: 5px 2px; }
.axis-key { display: flex; gap: 10px; margin: 5px 0; font-size: 12px; font-weight: 700; }
.axis-x { color: #ef4444; } .axis-y { color: #22c55e; } .axis-z { color: #3b82f6; }
.range-value { flex: 0 0 48px; text-align: right; font-variant-numeric: tabular-nums; }
#hierarchyTree { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px; }
.tree-row { display: flex; align-items: center; gap: 4px; padding: 2px; border-radius: 4px; font-size: 12px; }
.tree-row:focus { outline: 2px solid #3b82f6; outline-offset: -2px; }
.tree-row.tree-selected { background: var(--pill); }
.tree-row.tree-match { background: var(--warn-bg); }
.tree-row.tree-dim { opacity: 0.35; }
.tree-row.tree-filtered .tree-label { text-decoration: line-through; opacity: 0.65; }
.tree-toggle { width: 14px; flex: none; cursor: pointer; user-select: none; color: var(--muted); text-align: center; }
.tree-row input[type=checkbox] { margin: 0; flex: none; }
.tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-muted { color: var(--muted); font-size: 11px; }
.tree-warn { color: #d97706; }
.tree-actions { display: flex; gap: 3px; flex: none; }
.tree-action-btn { width: auto; margin: 0; padding: 2px 6px; font-size: 10px; }
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>GDML Inspector</h1>
  <div id="compat" class="warn" role="alert" style="display:none"></div>
  <div class="stat"><span>Source</span><b id="sourceName"></b></div>
  <div class="stat"><span>Objects</span><b id="objCount"></b></div>
  <div class="stat"><span>Triangles</span><b id="triCount"></b></div>
  <div class="stat"><span>Vertices</span><b id="vertexCount"></b></div>
  <div class="stat"><span>Backend</span><b id="backendName"></b></div>
  <div class="stat"><span>Quality</span><b id="qualityName"></b></div>
  <div class="stat"><span>World</span><b id="worldName"></b></div>
  <h2>View</h2>
  <button id="reset">Reset Camera</button>
  <div class="camera-actions">
    <button id="viewXYPos" title="Look toward the origin along -z">XY +Z</button>
    <button id="viewXYNeg" title="Look toward the origin along +z">XY -Z</button>
    <button id="viewXZPos" title="Look toward the origin along -y">XZ +Y</button>
    <button id="viewXZNeg" title="Look toward the origin along +y">XZ -Y</button>
    <button id="viewYZPos" title="Look toward the origin along -x">YZ +X</button>
    <button id="viewYZNeg" title="Look toward the origin along +x">YZ -X</button>
  </div>
  <label class="row"><span>Opacity</span><input id="opacity" type="range" min="5" max="100" value="78"></label>
  <label><input id="wireframe" type="checkbox"> Wireframe overlay</label>
  <label><input id="coordinateAxes" type="checkbox" checked> Coordinate axes</label>
  <div class="axis-key"><span class="axis-x">X</span><span class="axis-y">Y</span><span class="axis-z">Z</span></div>
  <label><input id="darkMode" type="checkbox"> Dark mode</label>
  <h2>View state</h2>
  <div id="viewStatePanel"></div>
  <h2>Clipping</h2>
  <div id="clipPanel"></div>
  <h2>Filter</h2>
  <div id="filterPanel"></div>
  <h2>Hierarchy</h2>
  <input id="hierarchySearch" placeholder="Search volume, placement, path...">
  <div class="row"><button id="hierarchyClearIsolation" style="display:none">Clear isolation</button></div>
  <div id="hierarchyTree" aria-label="Physical volume hierarchy"></div>
  <h2>Picked Object</h2>
  <div id="details"></div>
  <h2>Accuracy Notes</h2>
  <div class="row">
    <select id="diagnosticSeverity"></select>
    <select id="diagnosticCategory"></select>
  </div>
  <button id="downloadDiagnostics" type="button">Download report (JSON)</button>
  <div class="warn" id="warnings"></div>
</aside>
<main>
  <canvas id="gl"></canvas>
  <span id="axisLabelX" class="axis-label axis-x">X</span>
  <span id="axisLabelY" class="axis-label axis-y">Y</span>
  <span id="axisLabelZ" class="axis-label axis-z">Z</span>
  <div id="hud">Drag rotate. Wheel zoom. Shift-drag pan. Click inspect.</div>
</main>
</div>
<script>
__CLIPPING_JS__
__PICKING_JS__
__FILTERS_JS__
__TREE_JS__
__INSPECTOR_JS__
__COMMON_JS__
__VIEWSTATE_JS__
const SCENE = __SCENE__;
const HIERARCHY = __HIERARCHY__;
const SOLIDS = __SOLIDS__;
const INITIAL_VIEW = __VIEW_STATE__;
{
  const status = showSchemaStatus(schemaStatus(SCENE.meta.schemaVersion));
  if (status.level === 'future') throw new Error(status.message);
}
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {antialias: true, alpha: false});
if (!gl) alert('WebGL is not available in this browser.');
document.getElementById('sourceName').textContent = SCENE.meta.sourceFile || (SCENE.meta.source || '').split('/').pop();
document.getElementById('objCount').textContent = SCENE.meta.objects.toLocaleString();
document.getElementById('triCount').textContent = SCENE.meta.triangles.toLocaleString();
document.getElementById('vertexCount').textContent = SCENE.meta.vertices.toLocaleString();
document.getElementById('backendName').textContent = SCENE.meta.backend || 'unknown';
document.getElementById('qualityName').textContent = SCENE.meta.quality || 'unknown';
document.getElementById('worldName').textContent = SCENE.meta.world;

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const positions = new Float32Array(SCENE.positions);
const colorsRaw = new Uint8Array(SCENE.colors);
const ids = new Uint32Array(SCENE.ids);
const colors = new Float32Array(colorsRaw.length);
for (let i=0; i<colorsRaw.length; i++) colors[i] = colorsRaw[i] / 255;
const visible = new Float32Array(ids.length);
visible.fill(1);
let objectVisible = SCENE.objects.map(() => 1);
function fillSelect(id, title, values) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">All ${escapeHtml(title)}</option>`
    + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}

function materialColor(name) {
  const c = (SCENE.meta.materialColors && SCENE.meta.materialColors[name]) || [128,128,128,200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${Math.max(c[3] / 255, 0.35)})`;
}
// The shared filter panel (see assets/filters.js): search, exclude, solid type,
// materials and invert, evaluated from placement metadata.
const filterPanel = buildFilterPanel(document.getElementById('filterPanel'), {
  materials: Object.keys(SCENE.meta.materials).sort().map(name => ({
    name, count: SCENE.meta.materials[name], color: materialColor(name),
  })),
  solidTypes: Object.keys(SCENE.meta.solidTypes).sort(),
  onChange: () => applyFilters(),
});
const materialNames = filterPanel.materialNames;

// --- Diagnostics panel ("Accuracy Notes") ---------------------------------
// SCENE.meta.diagnostics/diagnosticSummary already carry everything this
// needs (code/severity/category/construct/identifier/backend/count); this
// used to only render the older flattened meta.warnings strings.
function diagnosticIdentifierKind(d) {
  // Derived from the exact diagnose() call sites in geometry.py/lazy.py/
  // pyg4ometry_backend.py -- not a backend field, since code (and, for
  // duplicate-definition, construct) already fully determines this:
  //   unsupported-daughter                        -> identifier is a volume name
  //   missing-solid-reference, boolean-approximated,
  //     unsupported-solid-type, pyg4ometry-fallback -> identifier is a solid ref
  //   duplicate-definition, construct=="volume"    -> volume name
  //   duplicate-definition, construct=="solid"     -> solid ref
  //   everything else (duplicate rotation/scale/position/assembly
  //     definitions, unevaluable-expression's attribute-key identifier,
  //     missing-volume-reference's never-placed ref, limit-reached's
  //     empty identifier) -> not a volume or solid name, not linkable
  if (d.code === 'unsupported-daughter') return 'volume';
  if (d.code === 'duplicate-definition') {
    if (d.construct === 'volume') return 'volume';
    if (d.construct === 'solid') return 'solid';
    return '';
  }
  if (['missing-solid-reference', 'boolean-approximated', 'unsupported-solid-type', 'pyg4ometry-fallback'].includes(d.code)) {
    return 'solid';
  }
  return '';
}
function matchesDiagnosticFilters(d) {
  const severity = document.getElementById('diagnosticSeverity').value;
  const category = document.getElementById('diagnosticCategory').value;
  return (!severity || d.severity === severity) && (!category || d.category === category);
}
function renderDiagnostics() {
  const box = document.getElementById('warnings');
  const matching = SCENE.meta.diagnostics.filter(matchesDiagnosticFilters);
  if (!matching.length) {
    box.textContent = SCENE.meta.diagnostics.length ? 'No diagnostics match this filter.' : 'No geometry warnings.';
    return;
  }
  box.innerHTML = matching.map(d => {
    const countSuffix = d.count > 1 ? ` <span class="pill">x${d.count}</span>` : '';
    const kind = diagnosticIdentifierKind(d);
    const linkBtn = kind
      ? `<button type="button" class="tree-action-btn diagnostic-link" data-query="${escapeHtml(d.identifier)}">Show in hierarchy</button>`
      : '';
    return `<div class="diagnostic-row"><b>${escapeHtml(d.severity)}</b> ${escapeHtml(d.message)}${countSuffix} ${linkBtn}</div>`;
  }).join('');
  box.querySelectorAll('.diagnostic-link').forEach(btn => {
    btn.addEventListener('click', () => {
      const search = document.getElementById('hierarchySearch');
      search.value = btn.dataset.query;
      applyHierarchySearch();
      search.scrollIntoView({block: 'nearest'});
    });
  });
}
fillSelect('diagnosticSeverity', 'severities', Array.from(new Set(SCENE.meta.diagnostics.map(d => d.severity))).sort());
fillSelect('diagnosticCategory', 'categories', Array.from(new Set(SCENE.meta.diagnostics.map(d => d.category))).sort());
['diagnosticSeverity', 'diagnosticCategory'].forEach(id => document.getElementById(id).addEventListener('input', renderDiagnostics));
renderDiagnostics();
document.getElementById('downloadDiagnostics').onclick = () => {
  const blob = new Blob([JSON.stringify(SCENE.meta.diagnostics, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (SCENE.meta.sourceFile || 'diagnostics').replace(/\.[^.]+$/, '') + '.diagnostics.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

// Shared clipping state (see assets/clipping.js); every fragment shader
// below, including the picking pass, applies it through clipDiscard().
let clipData = null;
buildClipPanel(document.getElementById('clipPanel'), {
  bbox: SCENE.meta.bbox,
  onChange: data => { clipData = data; },
});

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const vs = shader(gl.VERTEX_SHADER, `
attribute vec3 a_pos; attribute vec4 a_col; attribute float a_vis; attribute float a_highlight;
uniform mat4 u_mvp; uniform float u_opacity;
varying vec4 v_col; varying vec3 v_pos; varying float v_highlight;
void main() {
  gl_Position = u_mvp * vec4(a_pos, 1.0);
  v_col = vec4(a_col.rgb, a_col.a * u_opacity * a_vis);
  v_pos = a_pos;
  v_highlight = a_highlight;
}`);
const fs = shader(gl.FRAGMENT_SHADER, CLIP_FRAGMENT_PRECISION + `
varying vec4 v_col; varying vec3 v_pos; varying float v_highlight;
` + CLIP_GLSL + `
void main() {
  if (v_col.a < 0.01) discard;
  if (clipDiscard(v_pos)) discard;
  vec3 tinted = mix(v_col.rgb, vec3(1.0, 0.82, 0.2), 0.5 * v_highlight);
  gl_FragColor = vec4(tinted, v_col.a);
}`);
const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
const locPos = gl.getAttribLocation(prog, 'a_pos');
const locCol = gl.getAttribLocation(prog, 'a_col');
const locVis = gl.getAttribLocation(prog, 'a_vis');
const locHighlight = gl.getAttribLocation(prog, 'a_highlight');
function makeBuffer(data, usage=gl.DYNAMIC_DRAW) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage);
  return buf;
}
function setAttrib(loc, buf, size, type=gl.FLOAT, normalized=false) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, type, normalized, 0, 0);
}
function bindArray(name, data, size) {
  const loc = gl.getAttribLocation(prog, name);
  const buf = makeBuffer(data);
  setAttrib(loc, buf, size);
  return buf;
}
const surfacePosBuf = bindArray('a_pos', positions, 3);
const surfaceColBuf = bindArray('a_col', colors, 4);
const visibleBuf = bindArray('a_vis', visible, 1);
const highlight = new Float32Array(ids.length);
const highlightBuf = bindArray('a_highlight', highlight, 1);
const uMvp = gl.getUniformLocation(prog, 'u_mvp');
const uOpacity = gl.getUniformLocation(prog, 'u_opacity');
const clipLoc = clipLocations(gl, prog);
let wireBuffers = null;

// --- Depth-correct picking (see assets/picking.js) -----------------------
// The shared picker renders every visible object's id colour into an
// offscreen buffer under the active clipping and reads back the clicked pixel.
const picker = createPicker(gl, {visibility: true});
const idProg = picker.program;

// id+1, so a cleared (0,0,0,0) pixel decodes to "no object" (-1).
const idColors = new Uint8Array(ids.length * 4);
for (let i = 0; i < ids.length; i++) {
  const encoded = ids[i] + 1;
  idColors[i*4] = encoded & 255;
  idColors[i*4+1] = (encoded >> 8) & 255;
  idColors[i*4+2] = (encoded >> 16) & 255;
  idColors[i*4+3] = 255;
}
const idColorBuf = makeBuffer(idColors, gl.STATIC_DRAW);

function pickAt(devX, devY) {
  const cx = viewCenter[0] + panX, cy = viewCenter[1] + panY, cz = viewCenter[2];
  const eye = [cx + dist*Math.cos(pitch)*Math.sin(yaw), cy + dist*Math.sin(pitch), cz + dist*Math.cos(pitch)*Math.cos(yaw)];
  const mvp = mat4mul(perspective(45*Math.PI/180, canvas.width/canvas.height, radius/500, radius*20), lookAt(eye, [cx,cy,cz], cameraUp));
  return picker.pick(devX, devY, {
    width: canvas.width, height: canvas.height, mvp, clip: clipData,
    draw: locs => {
      setAttrib(locs.pos, surfacePosBuf, 3);
      setAttrib(locs.vis, visibleBuf, 1);
      setAttrib(locs.idColor, idColorBuf, 4, gl.UNSIGNED_BYTE, true);
      gl.drawArrays(gl.TRIANGLES, 0, positions.length/3);
    },
  });
}

const bbox = SCENE.meta.bbox;
const center = [(bbox[0]+bbox[3])/2, (bbox[1]+bbox[4])/2, (bbox[2]+bbox[5])/2];
const radius = Math.hypot(bbox[3]-bbox[0], bbox[4]-bbox[1], bbox[5]-bbox[2]) || 1;
const axisLength = radius * 0.18;
const axisPositions = new Float32Array([
  0,0,0, axisLength,0,0,
  0,0,0, 0,axisLength,0,
  0,0,0, 0,0,axisLength,
]);
const axisColors = new Float32Array([
  0.94,0.16,0.16,1, 0.94,0.16,0.16,1,
  0.10,0.78,0.30,1, 0.10,0.78,0.30,1,
  0.12,0.42,0.96,1, 0.12,0.42,0.96,1,
]);
const axisVisible = new Float32Array(6); axisVisible.fill(1);
const axisPosBuf = makeBuffer(axisPositions, gl.STATIC_DRAW);
const axisColBuf = makeBuffer(axisColors, gl.STATIC_DRAW);
const axisVisBuf = makeBuffer(axisVisible, gl.STATIC_DRAW);
const axisHighlightBuf = makeBuffer(new Float32Array(6), gl.STATIC_DRAW);
let yaw = -0.65, pitch = 0.45, dist = radius * 1.35, panX = 0, panY = 0;
let cameraUp = [0,1,0];
// The camera always looks at viewCenter, not the fixed global center -- a
// hierarchy focus action retargets it to a subtree's own bounds without
// disturbing the global radius used for clipping planes and zoom limits.
let viewCenter = center.slice();

function mat4mul(a,b) {
  const o = new Float32Array(16);
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) for (let k=0;k<4;k++) o[c*4+r] += a[k*4+r]*b[c*4+k];
  return o;
}
function perspective(fovy, aspect, near, far) {
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function lookAt(eye, target, up) {
  let zx=eye[0]-target[0], zy=eye[1]-target[1], zz=eye[2]-target[2];
  let zl=Math.hypot(zx,zy,zz); zx/=zl; zy/=zl; zz/=zl;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  let xl=Math.hypot(xx,xy,xz); xx/=xl; xy/=xl; xz/=xl;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*eye[0]+xy*eye[1]+xz*eye[2]), -(yx*eye[0]+yy*eye[1]+yz*eye[2]), -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1]);
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(canvas.clientWidth*dpr), h = Math.floor(canvas.clientHeight*dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0,0,w,h); }
}
function themeIsDark() { return document.body.classList.contains('dark'); }
function clearCanvas() {
  if (themeIsDark()) gl.clearColor(0.031,0.067,0.122,1);
  else gl.clearColor(0.985,0.99,1,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
}
function updateAxisLabels(mvp, enabled) {
  const endpoints = [
    ['axisLabelX', axisLength, 0, 0],
    ['axisLabelY', 0, axisLength, 0],
    ['axisLabelZ', 0, 0, axisLength],
  ];
  for (const [id, x, y, z] of endpoints) {
    const label = document.getElementById(id);
    const tx=mvp[0]*x+mvp[4]*y+mvp[8]*z+mvp[12];
    const ty=mvp[1]*x+mvp[5]*y+mvp[9]*z+mvp[13];
    const tw=mvp[3]*x+mvp[7]*y+mvp[11]*z+mvp[15];
    if (!enabled || tw <= 0) { label.style.display='none'; continue; }
    label.style.display='block';
    label.style.left=((tx/tw*0.5+0.5)*canvas.clientWidth)+'px';
    label.style.top=((-ty/tw*0.5+0.5)*canvas.clientHeight)+'px';
  }
}
function buildWireBuffers() {
  if (wireBuffers) return wireBuffers;
  const triCount = positions.length / 9;
  const linePositions = new Float32Array(triCount * 18);
  const lineColors = new Float32Array(triCount * 24);
  const lineIds = new Uint32Array(triCount * 6);
  const lineVisible = new Float32Array(triCount * 6);
  let p = 0, c = 0, n = 0;
  for (let i = 0; i < positions.length; i += 9) {
    const objId = ids[i / 3];
    const edges = [0,1, 1,2, 2,0];
    for (let e = 0; e < edges.length; e++) {
      const v = i + edges[e] * 3;
      linePositions[p++] = positions[v];
      linePositions[p++] = positions[v + 1];
      linePositions[p++] = positions[v + 2];
      if (themeIsDark()) { lineColors[c++] = 1; lineColors[c++] = 1; lineColors[c++] = 1; lineColors[c++] = 0.42; }
      else { lineColors[c++] = 0.02; lineColors[c++] = 0.04; lineColors[c++] = 0.08; lineColors[c++] = 0.35; }
      lineIds[n] = objId;
      lineVisible[n] = objectVisible[objId];
      n++;
    }
  }
  wireBuffers = {
    positions: linePositions,
    colors: lineColors,
    ids: lineIds,
    visible: lineVisible,
    posBuf: makeBuffer(linePositions, gl.STATIC_DRAW),
    colBuf: makeBuffer(lineColors),
    visBuf: makeBuffer(lineVisible),
    // The wireframe overlay never highlights the selected object itself
    // (only the main surface tints); this buffer stays all-zero so the
    // shared a_highlight attribute has a correctly-sized source to read.
    highlightBuf: makeBuffer(new Float32Array(lineVisible.length), gl.STATIC_DRAW),
  };
  return wireBuffers;
}
function updateWireColors() {
  if (!wireBuffers) return;
  for (let i = 0; i < wireBuffers.colors.length; i += 4) {
    if (themeIsDark()) {
      wireBuffers.colors[i] = 1; wireBuffers.colors[i + 1] = 1; wireBuffers.colors[i + 2] = 1; wireBuffers.colors[i + 3] = 0.42;
    } else {
      wireBuffers.colors[i] = 0.02; wireBuffers.colors[i + 1] = 0.04; wireBuffers.colors[i + 2] = 0.08; wireBuffers.colors[i + 3] = 0.35;
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, wireBuffers.colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, wireBuffers.colors, gl.DYNAMIC_DRAW);
}
function updateWireVisibility() {
  if (!wireBuffers) return;
  for (let i = 0; i < wireBuffers.ids.length; i++) wireBuffers.visible[i] = objectVisible[wireBuffers.ids[i]];
  gl.bindBuffer(gl.ARRAY_BUFFER, wireBuffers.visBuf);
  gl.bufferData(gl.ARRAY_BUFFER, wireBuffers.visible, gl.DYNAMIC_DRAW);
}
function updateWireHighlight() {
  if (!wireBuffers) return;
  const wireHighlight = new Float32Array(wireBuffers.ids.length);
  for (let i = 0; i < wireBuffers.ids.length; i++) {
    wireHighlight[i] = (wireBuffers.ids[i] === selectedObjectId) ? 1 : 0;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, wireBuffers.highlightBuf);
  gl.bufferData(gl.ARRAY_BUFFER, wireHighlight, gl.DYNAMIC_DRAW);
}
function render() {
  resize();
  clearCanvas();
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.DEPTH_TEST);
  const cx = viewCenter[0] + panX, cy = viewCenter[1] + panY, cz = viewCenter[2];
  const eye = [cx + dist*Math.cos(pitch)*Math.sin(yaw), cy + dist*Math.sin(pitch), cz + dist*Math.cos(pitch)*Math.cos(yaw)];
  const proj = perspective(45*Math.PI/180, canvas.width/canvas.height, radius/500, radius*20);
  const view = lookAt(eye, [cx,cy,cz], cameraUp);
  const mvp = mat4mul(proj, view);
  gl.uniformMatrix4fv(uMvp, false, mvp);
  setAttrib(locPos, surfacePosBuf, 3);
  setAttrib(locCol, surfaceColBuf, 4);
  setAttrib(locVis, visibleBuf, 1);
  setAttrib(locHighlight, highlightBuf, 1);
  gl.uniform1f(uOpacity, +document.getElementById('opacity').value/100);
  uploadClip(gl, clipLoc, clipData);
  gl.drawArrays(gl.TRIANGLES, 0, positions.length/3);
  if (document.getElementById('wireframe').checked) {
    const wire = buildWireBuffers();
    setAttrib(locPos, wire.posBuf, 3);
    setAttrib(locCol, wire.colBuf, 4);
    setAttrib(locVis, wire.visBuf, 1);
    setAttrib(locHighlight, wire.highlightBuf, 1);
    gl.uniform1f(uOpacity, 1.0);
    gl.drawArrays(gl.LINES, 0, wire.positions.length/3);
  }
  const axesEnabled = document.getElementById('coordinateAxes').checked;
  if (axesEnabled) {
    setAttrib(locPos, axisPosBuf, 3);
    setAttrib(locCol, axisColBuf, 4);
    setAttrib(locVis, axisVisBuf, 1);
    setAttrib(locHighlight, axisHighlightBuf, 1);
    gl.uniform1f(uOpacity, 1.0);
    uploadClip(gl, clipLoc, null);
    gl.drawArrays(gl.LINES, 0, axisPositions.length/3);
  }
  updateAxisLabels(mvp, axesEnabled);
  requestAnimationFrame(render);
}
render();

let drag = null;
canvas.addEventListener('mousedown', e => drag = {x:e.clientX, y:e.clientY, shift:e.shiftKey});
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if (drag.shift) { panX -= dx*dist/900; panY += dy*dist/900; }
  else { yaw += dx*0.006; pitch = Math.max(-1.55, Math.min(1.55, pitch + dy*0.006)); cameraUp = [0,1,0]; }
});
canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(radius*0.01, Math.min(radius*50, dist*Math.exp(e.deltaY*0.001))); }, {passive:false});
function setCamera(newYaw, newPitch, up) {
  yaw=newYaw; pitch=newPitch; cameraUp=up; viewCenter=center.slice(); dist=radius*1.35; panX=0; panY=0;
}
document.getElementById('reset').onclick = () => setCamera(-0.65, 0.45, [0,1,0]);
document.getElementById('viewXYPos').onclick = () => setCamera(0, 0, [0,1,0]);
document.getElementById('viewXYNeg').onclick = () => setCamera(Math.PI, 0, [0,1,0]);
document.getElementById('viewXZPos').onclick = () => setCamera(0, Math.PI/2, [0,0,1]);
document.getElementById('viewXZNeg').onclick = () => setCamera(0, -Math.PI/2, [0,0,1]);
document.getElementById('viewYZPos').onclick = () => setCamera(Math.PI/2, 0, [0,0,1]);
document.getElementById('viewYZNeg').onclick = () => setCamera(-Math.PI/2, 0, [0,0,1]);
document.getElementById('wireframe').addEventListener('change', () => { if (document.getElementById('wireframe').checked) buildWireBuffers(); });
document.getElementById('darkMode').addEventListener('change', e => {
  document.body.classList.toggle('dark', e.target.checked);
  updateWireColors();
});
function applyFilters() {
  const matches = compileFilter(filterPanel.state());
  let matched = 0;
  objectVisible = SCENE.objects.map((o, id) => {
    const match = matches(o);
    if (match) matched++;
    if (hierarchyHidden.has(id)) return 0;
    if (isolatedPath && !pathIsDescendantOrSelf(o.path, isolatedPath)) return 0;
    return match ? 1 : 0;
  });
  filterPanel.setCounts({total: SCENE.objects.length, matched, shown: objectVisible.reduce((a, b) => a + b, 0)});
  for (let i=0; i<ids.length; i++) visible[i] = objectVisible[ids[i]];
  gl.bindBuffer(gl.ARRAY_BUFFER, visibleBuf); gl.bufferData(gl.ARRAY_BUFFER, visible, gl.DYNAMIC_DRAW);
  updateWireVisibility();
  updateAllRowStates();
  if (selectedObjectId !== null && !objectVisible[selectedObjectId]) clearSelection();
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const devX = Math.floor((e.clientX - rect.left) * dpr);
  const devY = canvas.height - 1 - Math.floor((e.clientY - rect.top) * dpr);
  selectObject(pickAt(devX, devY));
});

// --- Physical-volume hierarchy (see assets/tree.js) ----------------------
// Built from HIERARCHY, a flat pre-order list of every placement (rendered
// or not) keyed by path, independent of SCENE.objects; see HierarchyMixin in
// hierarchy.py. Unexpanded subtrees never reach the DOM.
const worldPath = SCENE.meta.world;
const approximatedSolids = new Set(
  SCENE.meta.diagnostics.filter(d => d.category === 'unsupported').map(d => d.identifier)
);
const hierarchyHidden = new Set();
let isolatedPath = null;
let selectedPath = null;

const tree = createHierarchyTree(document.getElementById('hierarchyTree'), {
  nodes: HIERARCHY,
  worldPath,
  selected: () => selectedPath,
  onSelect: path => {
    selectedPath = path;
    const node = tree.nodeByPath[path];
    setHighlightedObject(node.rendered ? node.objectId : null);
    updateInspector(path);
  },
  checkbox: {onChange: (path, checked) => setSubtreeHidden(path, !checked)},
  actions: [
    {label: 'Isolate', onClick: path => toggleIsolate(path)},
    {label: 'Focus', onClick: path => focusOnPath(path)},
  ],
  labelExtra: node => nodeIsApproximated(node) ? ' <span class="tree-warn" title="Approximated geometry">⚠</span>' : '',
  searchExtra: node => node.rendered && node.objectId !== undefined ? SCENE.objects[node.objectId].solid : '',
  decorateRow: visibilityDecorator(() => tree, hierarchyHidden, () => isolatedPath, id => objectVisible[id] === 1),
  afterRefresh: () => {
    document.getElementById('hierarchyClearIsolation').style.display = isolatedPath ? '' : 'none';
  },
});
const nodeByPath = tree.nodeByPath;
const expandedPaths = tree.expandedPaths;
const rowElements = tree.rowElements;
const renderTree = tree.render;
const updateAllRowStates = tree.refreshStates;
const subtreeObjectIds = tree.subtreeObjectIds;

function nodeIsApproximated(node) {
  if (!node.rendered || node.objectId === undefined) return false;
  return approximatedSolids.has(SCENE.objects[node.objectId].solid);
}
function setSubtreeHidden(path, hidden) {
  for (const id of subtreeObjectIds(path)) {
    if (hidden) hierarchyHidden.add(id); else hierarchyHidden.delete(id);
  }
  applyFilters();
}
function toggleIsolate(path) {
  isolatedPath = (isolatedPath === path) ? null : path;
  applyFilters();
}
document.getElementById('hierarchyClearIsolation').onclick = () => { isolatedPath = null; applyFilters(); };

function focusOnPath(path) {
  const box = focusBounds(tree, id => SCENE.objects[id], path);
  if (!box) { viewCenter = center.slice(); dist = radius*1.35; }
  else {
    viewCenter = [(box[0]+box[3])/2, (box[1]+box[4])/2, (box[2]+box[5])/2];
    const r = Math.hypot(box[3]-box[0], box[4]-box[1], box[5]-box[2]) || radius*0.05;
    dist = Math.max(r*1.6, radius*0.02);
  }
  panX = 0; panY = 0;
}

function applyHierarchySearch() { tree.search(document.getElementById('hierarchySearch').value); }
document.getElementById('hierarchySearch').addEventListener('input', applyHierarchySearch);

function revealInHierarchy(path) {
  if (!nodeByPath[path]) return;
  selectedPath = path;
  tree.reveal(path);
}

// --- Selection: viewport highlight + the "Picked Object" inspector -------
let selectedObjectId = null;

function setHighlightedObject(id) {
  selectedObjectId = (id !== null && id >= 0) ? id : null;
  for (let i = 0; i < ids.length; i++) highlight[i] = (ids[i] === selectedObjectId) ? 1 : 0;
  gl.bindBuffer(gl.ARRAY_BUFFER, highlightBuf);
  gl.bufferData(gl.ARRAY_BUFFER, highlight, gl.DYNAMIC_DRAW);
  updateWireHighlight();
}

const inspector = buildInspector(document.getElementById('details'), {
  actions: [[
    {id: 'detailFocus', label: 'Focus', onClick: info => focusOnPath(info.path)},
    {id: 'detailIsolate', label: 'Isolate', onClick: info => toggleIsolate(info.path)},
  ]],
});

function updateInspector(path) {
  const node = path ? nodeByPath[path] : null;
  if (!node) { inspector.clear(); return; }
  const object = node.rendered && node.objectId !== undefined ? SCENE.objects[node.objectId] : null;
  inspector.show(inspectorInfo(nodeByPath, node, object, SOLIDS, approximatedSolids));
}

function selectObject(id) {
  if (id === null || id < 0) { clearSelection(); return; }
  const path = SCENE.objects[id].path;
  setHighlightedObject(id);
  updateInspector(path);
  revealInHierarchy(path);
}
function clearSelection() {
  selectedObjectId = null;
  selectedPath = null;
  setHighlightedObject(null);
  updateInspector(null);
  updateAllRowStates();
}

renderTree();

// --- Saved view state (see assets/viewstate.js) --------------------------
// Everything is stored by placement path / name, never numeric id, so a view
// survives a re-export; entries that no longer exist are reported.
function captureViewSections() {
  const input = document.getElementById.bind(document);
  return {
    camera: {yaw, pitch, dist, pan: [panX, panY], viewCenter: viewCenter.slice(), up: cameraUp.slice()},
    projection: {type: 'perspective', fovDeg: 45},
    display: {
      opacity: +input('opacity').value,
      wireframe: input('wireframe').checked,
      axes: input('coordinateAxes').checked,
      theme: document.body.classList.contains('dark') ? 'dark' : 'light',
    },
    clipping: getClipState(),
    filters: filterPanel.state(),
    hierarchy: {
      hiddenPaths: [...hierarchyHidden].map(id => SCENE.objects[id].path).sort(),
      expandedPaths: [...expandedPaths].sort(),
      isolatedPath,
      selectedPath,
      search: input('hierarchySearch').value,
    },
  };
}

async function applyViewSections(state, report) {
  const input = document.getElementById.bind(document);
  const fire = (id, type) => input(id).dispatchEvent(new Event(type, {bubbles: true}));
  if (state.layers) report.ignored.push('layers');
  if (state.display) {
    const d = state.display;
    if (d.opacity !== undefined) { input('opacity').value = d.opacity; fire('opacity', 'input'); }
    if (d.wireframe !== undefined) { input('wireframe').checked = d.wireframe; fire('wireframe', 'change'); }
    if (d.axes !== undefined) { input('coordinateAxes').checked = d.axes; fire('coordinateAxes', 'change'); }
    if (d.theme !== undefined) { input('darkMode').checked = d.theme === 'dark'; fire('darkMode', 'change'); }
    report.applied.push('display');
  }
  if (state.camera) {
    const c = state.camera;
    yaw = c.yaw; pitch = c.pitch; dist = c.dist; panX = c.pan[0]; panY = c.pan[1];
    cameraUp = c.up.slice();
    viewCenter = c.viewCenter ? c.viewCenter.slice() : center.slice();
    report.applied.push('camera');
  }
  if (state.projection) report.applied.push('projection');
  if (state.clipping) { setClipState(state.clipping); report.applied.push('clipping'); }
  if (state.filters) {
    report.unknown.push(...filterPanel.set(state.filters));
    report.applied.push('filters');
  }
  if (state.hierarchy) {
    const h = state.hierarchy;
    hierarchyHidden.clear();
    for (const path of h.hiddenPaths) {
      const node = nodeByPath[path];
      if (node && node.objectId !== undefined) hierarchyHidden.add(node.objectId);
      else report.unknown.push({kind: 'hidden placement', value: path});
    }
    if (h.isolatedPath !== null && !nodeByPath[h.isolatedPath]) {
      report.unknown.push({kind: 'isolated placement', value: h.isolatedPath});
      isolatedPath = null;
    } else isolatedPath = h.isolatedPath;
    expandedPaths.clear();
    for (const path of h.expandedPaths) {
      if (nodeByPath[path]) expandedPaths.add(path);
      else report.unknown.push({kind: 'expanded placement', value: path});
    }
    input('hierarchySearch').value = h.search;
  }
  applyFilters();
  if (state.hierarchy) {
    const path = state.hierarchy.selectedPath;
    clearSelection();
    const node = path === null ? null : nodeByPath[path];
    if (path !== null && !node) report.unknown.push({kind: 'selected placement', value: path});
    else if (node && node.rendered && node.objectId !== undefined) {
      setHighlightedObject(node.objectId);
      updateInspector(path);
      revealInHierarchy(path);
    } else if (node) {
      selectedPath = path;
      updateInspector(path);
    }
    renderTree();
    if (state.hierarchy.search) applyHierarchySearch();
    report.applied.push('hierarchy');
  }
}

buildViewStatePanel(document.getElementById('viewStatePanel'), {
  viewer: 'standalone',
  bbox: SCENE.meta.bbox,
  saved: {
    schemaVersion: SCENE.meta.schemaVersion === undefined ? 1 : SCENE.meta.schemaVersion,
    inputSha256: SCENE.meta.provenance ? SCENE.meta.provenance.input.sha256 : null,
    sourceFile: SCENE.meta.sourceFile,
  },
  capture: captureViewSections,
  apply: applyViewSections,
});
if (INITIAL_VIEW) loadViewState(INITIAL_VIEW, 'embedded view state');
</script>
</body>
</html>
