[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdml-inspector"
version = "0.3.0"
description = "Inspect and share Geant4 GDML geometries in a browser"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alexander Pesch Berrocal"}]
keywords = ["GDML", "Geant4", "geometry", "HEP", "WebGL"]
dependencies = []

[project.urls]
Repository = "https://github.com/AlexanderPeschBerrocal/gdml-inspector"
Issues = "https://github.com/AlexanderPeschBerrocal/gdml-inspector/issues"

[project.optional-dependencies]
pyg4ometry = ["pyg4ometry"]

# Development tools are local dependency groups, not published package extras.
[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6,<7",
    "tomli>=2; python_version < '3.11'",
    # Real headless-browser verification for the embedded viewer JS, which
    # no Python unit test can otherwise exercise. Needs a one-time
    # `playwright install chromium` (see docs/contributing.md).
    "playwright>=1.47,<2",
    "pytest-playwright>=0.5,<1",
]
lint = ["ruff==0.16.5"]
typing = [
    "mypy==1.19.1",
    "typing-extensions>=4.12",
    # scripts/release.py and check_release.py's own 3.10-compat tomllib
    # fallback: mypy's python_version=3.10 setting (pyproject.toml below)
    # statically type-checks that branch regardless of which Python
    # actually runs mypy, so unlike the test group's own tomli entry, this
    # one is NOT conditioned on the running interpreter's version.
    "tomli>=2",
]
release = ["bump-my-version==1.6.1"]
hooks = [{ include-group = "lint" }, "pre-commit>=4,<5"]
build = ["build>=1.2", "setuptools==84.2.1", "wheel==0.48.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    { include-group = "release" },
    { include-group = "build" },
    { include-group = "hooks" },
]

[tool.uv]
# Match CI and the documented installation command; upgrades are deliberate.
required-version = "==0.13.6"
# Editable/isolated uv builds use the same backend versions as the build group.
# Ordinary pip users retain the compatibility ranges in [build-system].
build-constraint-dependencies = ["setuptools==84.2.1", "wheel==0.48.0"]

[project.scripts]
gdml-inspector = "gdml_inspector.cli:main"
gdml-inspector-lazy = "gdml_inspector.cli:lazy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gdml_inspector.assets" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

[tool.coverage.run]
source = ["gdml_inspector"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 1
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88
# Keep generated geometry exports and build products out of source checks,
# including when their paths are passed explicitly by a hook or editor.
extend-exclude = ["exports", "build", "dist"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bumpversion]
# scripts/release.py owns the actual git commit/tag; this only edits the file.
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.mypy]
python_version = "3.10"
files = ["src/gdml_inspector", "scripts"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# pyg4ometry ships neither inline types nor maintained stubs.
[[tool.mypy.overrides]]
module = ["pyg4ometry.*"]
ignore_missing_imports = true
