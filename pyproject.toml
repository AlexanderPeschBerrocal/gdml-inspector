[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdml-inspector"
version = "0.1.0"
description = "Inspect and share Geant4 GDML geometries in a browser"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alexander Pesch Berrocal"}]
keywords = ["GDML", "Geant4", "geometry", "HEP", "WebGL"]
dependencies = []

[project.urls]
Repository = "https://github.com/AlexanderPeschBerrocal/gdml-inspector"
Issues = "https://github.com/AlexanderPeschBerrocal/gdml-inspector/issues"

[project.optional-dependencies]
pyg4ometry = ["pyg4ometry"]

# Development tools are local dependency groups, not published package extras.
[dependency-groups]
test = ["pytest>=8,<10"]
lint = ["ruff==0.16.5"]
hooks = [{ include-group = "lint" }, "pre-commit>=4,<5"]
build = ["build>=1.2", "setuptools==84.2.1", "wheel==0.48.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
    { include-group = "hooks" },
]

[tool.uv]
# Match CI and the documented installation command; upgrades are deliberate.
required-version = "==0.13.6"
# Editable/isolated uv builds use the same backend versions as the build group.
# Ordinary pip users retain the compatibility ranges in [build-system].
build-constraint-dependencies = ["setuptools==84.2.1", "wheel==0.48.0"]

[project.scripts]
gdml-inspector = "gdml_inspector.cli:main"
gdml-inspector-lazy = "gdml_inspector.cli:lazy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gdml_inspector.assets" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
# Keep generated geometry exports and build products out of source checks,
# including when their paths are passed explicitly by a hook or editor.
extend-exclude = ["exports", "build", "dist"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
